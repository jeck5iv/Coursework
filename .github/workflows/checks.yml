name: Reserve model checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-checks.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/reserve_audit.py --draws 100000 --seed 12345
